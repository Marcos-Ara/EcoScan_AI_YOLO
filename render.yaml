services:
  - type: web
    name: ecoscan-yolo-api
    runtime: docker
    plan: free

    dockerfilePath: ./Dockerfile

    healthCheckPath: /health

    envVars:
      - key: ROBOFLOW_API_KEY
        sync: false

      - key: ROBOFLOW_API_URL
        value: https://serverless.roboflow.com

      - key: ROBOFLOW_MODEL_ID
        value: waste-sorting-smyr8/2

      - key: CONFIDENCE
        value: "0.40"

      - key: IOU
        value: "0.45"

      - key: MAX_FILE_SIZE
        value: "1500000"

      - key: MAX_IMAGE_DIMENSION
        value: "960"

      - key: MAX_DETECTIONS
        value: "1"

      - key: FOCUS_MODE
        value: "true"

      - key: FOCUS_CROP_RATIO
        value: "0.90"

      - key: FOCUS_MAX_DETECTIONS
        value: "1"

      - key: DEBUG_PREDICTIONS
        value: "false"

      - key: ROBOFLOW_TIMEOUT_SECONDS
        value: "30"

      - key: ALLOWED_ORIGIN
        value: https://marcos-ara.github.io
